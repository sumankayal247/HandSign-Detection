<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Fingerspelling Recognition</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖐️</text></svg>">
    <!-- MediaPipe Tasks Vision CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: white; color: black; text-align: center; margin: 0; padding: 20px; }
        .page-layout { display: flex; justify-content: center; align-items: flex-start; gap: 30px; max-width: 1400px; margin: auto; }
        .side-panel { display: flex; flex-direction: column; align-items: center; }
        .side-panel img { width: 250px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); flex-grow: 1; max-width: 700px; border: 1px solid #eee; }
        h1 { color: #000; margin-top: 0; }
        .video-container { position: relative; width: 640px; height: 480px; margin: auto; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #ccc; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .overlays { position: absolute; top: 10px; left: 10px; text-align: left; text-shadow: 2px 2px 4px #000; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; }
        .raw { color: #ff3333; }
        .stable { color: #39ff14; }
        .accumulated { color: #33ccff; }
        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; background: #39ff14; color: #000; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2ecc11; transform: scale(1.05); }
        #permission-message { color: #ff3333; font-weight: bold; margin-top: 15px; }
        .alphabet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .alphabet-grid img { width: 100px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white; }
        .bottom-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .bottom-grid img { width: 100px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="page-layout">
        <!-- Left Part -->
        <div class="side-panel">
            <div class="alphabet-grid">
                <img src="letters/A.png" alt="A"><img src="letters/B.png" alt="B">
                <img src="letters/C.png" alt="C"><img src="letters/D.png" alt="D">
                <img src="letters/E.png" alt="E"><img src="letters/F.png" alt="F">
                <img src="letters/G.png" alt="G"><img src="letters/H.png" alt="H">
                <img src="letters/I.png" alt="I"><img src="letters/J.png" alt="J">
            </div>
        </div>

        <!-- Center App -->
        <div class="container">
            <h1>ASL Real-Time Recognition</h1>
            <p>Ensure your webcam is enabled and sign ASL alphabets to the camera.</p>
            
            <div id="permission-message"></div>
            
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas" width="640" height="480"></canvas>
                <div class="overlays">
                    <div class="raw" id="raw-text">Raw Pred: UNKNOWN</div>
                    <div class="stable" id="stable-text">Stable: STABILIZING...</div>
                    <div class="accumulated" id="accum-text">Text: </div>
                </div>
            </div>

            <div class="controls">
                <button onclick="clearText()">Clear Text</button>
                <button onclick="addSpace()">Add Space</button>
                <button onclick="speakText()">Speak (TTS)</button>
            </div>
            
            <!-- Bottom Part -->
            <div class="bottom-grid">
                <img src="letters/U.png" alt="U"><img src="letters/V.png" alt="V">
                <img src="letters/W.png" alt="W"><img src="letters/X.png" alt="X">
                <img src="letters/Y.png" alt="Y"><img src="letters/Z.png" alt="Z">
            </div>
        </div>

        <!-- Right Part -->
        <div class="side-panel">
            <div class="alphabet-grid">
                <img src="letters/K.png" alt="K"><img src="letters/L.png" alt="L">
                <img src="letters/M.png" alt="M"><img src="letters/N.png" alt="N">
                <img src="letters/O.png" alt="O"><img src="letters/P.png" alt="P">
                <img src="letters/Q.png" alt="Q"><img src="letters/R.png" alt="R">
                <img src="letters/S.png" alt="S"><img src="letters/T.png" alt="T">
            </div>
        </div>
    </div>

    <!-- The exported m2cgen model JS will be included here -->
    <!-- Our app logic -->
    <script type="module" src="app.js?v=7"></script>
</body>
</html>
